<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tablas</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:Arial,Helvetica,sans-serif}

<g transform="translate(250,490)">
<line x1="0" y1="0" x2="45" y2="0" stroke="#111827" stroke-width="2.5"/><text x="55" y="5" class="f">Relación real con llave foránea, dentro de la misma base</text>
<line x1="0" y1="32" x2="45" y2="32" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5"/><text x="55" y="37" class="f">Solo se guarda el id, sin llave foránea, porque el dato vive en otro microservicio</text>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Arquitectura</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:Arial,Helvetica,sans-serif}

.box{fill:#fff;stroke-width:2}.e{font-size:13px;fill:#374151}.h{font-size:24px;font-weight:700;fill:#111827}</style></head><body>

<text x="600" y="40" class="h c">Microservicios y bases de datos del sistema de proveedores y compras</text>

<rect x="470" y="65" width="260" height="60" rx="8" class="box" stroke="#6b7280"/>

<path d="M520 125 L180 262" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)"/>

<rect x="50" y="265" width="280" height="130" rx="8" class="box" stroke="#0f766e"/>

<rect x="460" y="265" width="280" height="130" rx="8" class="box" stroke="#0f766e"/>

<rect x="870" y="265" width="280" height="130" rx="8" class="box" stroke="#0f766e"/>

<text x="1010" y="345" class="s c">Compras con sus detalles</text><text x="1010" y="367" class="s c">Calcula subtotales y total</text>

<!-- Feign -->
<path d="M460 315 L330 315" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/>

<g fill="#fff" stroke="#b45309" stroke-width="2">
<path d="M90 470 v62 a100 16 0 0 0 200 0 v-62"/><ellipse cx="190" cy="470" rx="100" ry="16"/>
<path d="M500 470 v62 a100 16 0 0 0 200 0 v-62"/><ellipse cx="600" cy="470" rx="100" ry="16"/>

<rect x="350" y="620" width="500" height="70" rx="8" class="box" stroke="#7c3aed"/>

<path d="M60 395 L60 655 L350 655" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
<path d="M480 395 L480 620" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
<path d="M1140 395 L1140 655 L850 655" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" fill="none"/>

<g transform="translate(350,715)">

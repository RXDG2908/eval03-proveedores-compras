server:
  port: 9083

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_compra_prod}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

empresa:
  ambiente: produccion

# Registro en Eureka Server
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
